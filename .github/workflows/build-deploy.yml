name: Build & Deploy (Bifrost fork)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "GitOps environment to deploy (folder under apps/bifrost/)"
        type: choice
        default: qa
        options:
          - qa
      deploy:
        description: "Bump the image tag in the GitOps repo after pushing"
        type: boolean
        default: true
  push:
    branches:
      - dev

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  GITOPS_REPO: ${{ secrets.GITOPS_REPO }}

jobs:
  build-and-push:
    name: Build & push image to ECR
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Compute image tag
        id: vars
        run: |
          SHORT_SHA="${GITHUB_SHA:0:8}"
          echo "image_tag=ai-gateway-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ai-gateway-${SHORT_SHA}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: transports/Dockerfile.local
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            VERSION=${{ steps.vars.outputs.image_tag }}
          tags: ${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Bump GitOps image tag
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.deploy }}
    env:
      ENVIRONMENT: ${{ inputs.environment || 'qa' }}
      IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          path: CD
          ref: main
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Install yq
        run: |
          sudo wget -O /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update image tag
        run: |
          cd CD
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          FILE="apps/bifrost/${ENVIRONMENT}/deployment.yaml"
          echo "Updating ${FILE} -> image.tag=${IMAGE_TAG}"
          TAG="$IMAGE_TAG" yq -i '.spec.values.image.tag = strenv(TAG)' "$FILE"
          git add "$FILE"
          git commit -m "Update bifrost to $IMAGE_TAG"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT }}
          path: ./CD/
          branch: update-bifrost-${{ env.ENVIRONMENT }}
          base: main
          delete-branch: true
          title: "[AUTOMATED] Update bifrost on ${{ env.ENVIRONMENT }}"
          body: "This PR updates the bifrost version to ${{ env.IMAGE_TAG }}"
          labels: "bifrost,${{ env.ENVIRONMENT }}"
