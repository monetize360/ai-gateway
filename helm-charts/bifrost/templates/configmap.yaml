{{- /* When bifrost.existingConfigSecret is set, config.json is mounted from that
       (Sealed)Secret instead, so skip rendering this ConfigMap entirely. */ -}}
{{- if not .Values.bifrost.existingConfigSecret }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bifrost.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bifrost.labels" . | nindent 4 }}
data:
  config.json: |
    {{- if .Values.bifrost.rawConfigJson }}
    {{- .Values.bifrost.rawConfigJson | nindent 4 }}
    {{- else }}
    {{- include "bifrost.config" . | nindent 4 }}
    {{- end }}
{{- end }}